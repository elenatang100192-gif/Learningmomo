# Railpack / Nixpacks 配置
# 用于 Railway / Render / Fly.io 等支持 Nixpacks 的平台
# 因为这是个 monorepo（server/ + web/），需要在仓库根显式告诉构建器构建哪个子项目

[phases.setup]
nixPkgs = ["nodejs-20_x", "openssl"]

[phases.install]
cmds = ["cd server && npm ci --include=dev --legacy-peer-deps"]

[phases.build]
cmds = [
  "cd server && npx prisma generate",
  "cd server && npm run build"
]

[start]
cmd = "cd server && node dist/main.js"
